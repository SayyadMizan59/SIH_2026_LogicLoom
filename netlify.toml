[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Direct all API requests to the Express serverless function
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Direct session logout through the serverless function
[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/api/logout"
  status = 200

# Redirect root and index.html to /login (force = true overrides static public/index.html)
[[redirects]]
  from = "/"
  to = "/login"
  status = 302
  force = true

[[redirects]]
  from = "/index.html"
  to = "/login"
  status = 302
  force = true

# Clean UI page routing to public/ static HTML pages
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/user"
  to = "/user.html"
  status = 200

[[redirects]]
  from = "/roles"
  to = "/roles.html"
  status = 200

[[redirects]]
  from = "/assets"
  to = "/assets.html"
  status = 200

[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200
